{% extends "base.html" %} 
{% block title %}Brain Gym{% endblock %} 
{% block content %}
<div class="container mt-5 text-center text-white">
    <h2>Brain Gym: Sudoku</h2>
    <p>Sharpen your logic. Fill the grid.</p>
    
    <div id="sudoku-board" class="d-flex justify-content-center flex-wrap" style="max-width: 450px; margin: 0 auto;">
        </div>
    
    <button onclick="window.location.reload()" class="btn btn-primary mt-4">New Game</button>
</div>

<style>
    .sudoku-cell {
        width: 48px; height: 48px;
        border: 1px solid #333;
        text-align: center;
        font-size: 20px;
        background: white; color: black;
    }
    .sudoku-input { width: 100%; height: 100%; border: none; text-align: center; }
</style>

<script>
    // Simple mock Sudoku for demonstration
    const board = [
        [5,3,0, 0,7,0, 0,0,0], [6,0,0, 1,9,5, 0,0,0], [0,9,8, 0,0,0, 0,6,0],
        [8,0,0, 0,6,0, 0,0,3], [4,0,0, 8,0,3, 0,0,1], [7,0,0, 0,2,0, 0,0,6],
        [0,6,0, 0,0,0, 2,8,0], [0,0,0, 4,1,9, 0,0,5], [0,0,0, 0,8,0, 0,7,9]
    ];

    const container = document.getElementById('sudoku-board');
    
    board.forEach((row, rIndex) => {
        row.forEach((num, cIndex) => {
            let div = document.createElement('div');
            div.className = 'sudoku-cell';
            if (num !== 0) {
                div.textContent = num;
                div.style.backgroundColor = '#ddd'; // Locked cells
            } else {
                let input = document.createElement('input');
                input.className = 'sudoku-input';
                input.type = 'number';
                div.appendChild(input);
            }
            container.appendChild(div);
        });
    });
</script>
{% endblock %}
