{% extends "base.html" %}
{% block title %}Tetris{% endblock %}

{% block content %}
<div class="container mt-4 mb-5 text-center">
    <h2 class="mb-2">Organize (Tetris)</h2>
    <p class="mb-4">Arrange the falling blocks. Bring order to chaos.</p>

    <div id="tetris-container">
        <div id="tetris">
            
            <div id="menu">
                <div class="menu-card">
                    <p class="label">Score</p>
                    <span id="score">00000</span>
                </div>
                
                <div class="menu-card">
                    <p class="label">Rows</p>
                    <span id="rows">0</span>
                </div>

                <div class="menu-card">
                    <p class="label">Next Piece</p>
                    <canvas id="upcoming"></canvas>
                </div>

                <div id="start">
                    <a href="javascript:play();" class="btn btn-primary btn-block">Press Space<br>to Play</a>
                </div>
            </div>

            <canvas id="canvas" width="300" height="600"></canvas>

        </div>
    </div>

    <div class="mt-3">
        <small>Controls: Space (Start), Arrows (Move/Rotate), Esc (Quit)</small>
    </div>
</div>

<style>
    /* 1. Main Container */
    #tetris-container {
        display: flex;
        justify-content: center;
    }

    /* 2. Game Card Styling */
    #tetris {
        display: flex;
        flex-direction: row; 
        align-items: flex-start;
        background-color: #2c3e50; 
        padding: 20px;
        border-radius: 15px;
        border: 1px solid #444;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* 3. Left Menu Styling */
    #menu {
        width: 200px; /* INCREASED: From 160px to 200px to fit the canvas */
        display: flex;
        flex-direction: column;
        margin-right: 20px;
        color: white; 
    }

    .menu-card {
        background: rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;     
        justify-content: center; 
    }

    .label {
        margin: 0;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #aaa;
        margin-bottom: 5px;
    }

    /* 4. Large Stats Text */
    #score, #rows {
        font-size: 1.8rem;
        font-weight: bold;
        color: #feca57; 
        display: block;
        line-height: 1.2;
    }

    /* 5. Next Piece Canvas - THE FIX */
    #upcoming {
        display: block;
        width: 150px;  /* FIXED: Matches exactly 5 blocks x 30px */
        height: 150px; /* Square aspect ratio */
        background-color: #444;
        border: 2px solid #555;
        border-radius: 4px;
        padding: 0; /* Remove padding to ensure exact fit */
        margin-top: 5px; 
    }

    /* 6. Main Game Board */
    #canvas {
        background: url('{{ url_for('static', filename='games/tetris/texture.jpg') }}');
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        border: 4px solid #333;
        border-radius: 4px;
        /* Ensure the main canvas stays at 300px width for the math to work */
        width: 300px;
        height: 600px;
    }

    #stats { display: none !important; }

    /* Mobile Responsiveness */
    @media (max-width: 650px) { /* Increased breakpoint slightly */
        #tetris {
            flex-direction: column-reverse; 
            align-items: center;
        }
        #menu {
            width: 100%;
            margin-right: 0;
            margin-top: 20px;
            flex-direction: row;
            justify-content: space-around; /* Better spacing on mobile */
            flex-wrap: wrap;
        }
        .menu-card {
            width: 45%;
        }
    }
</style>

<script src="{{ url_for('static', filename='games/tetris/stats.js') }}"></script>
<script src="{{ url_for('static', filename='games/tetris/tetris.js') }}"></script>
{% endblock %}
