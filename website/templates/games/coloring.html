{% extends "base.html" %} 
{% block title %}Zen Zone{% endblock %} 
{% block content %}
<div class="container mt-5 text-center">
    <h2 class="text-white">Zen Zone: Mindful Coloring</h2>
    <p class="text-white">Pick a color and relax. No goals, just flow.</p>
    
    <div style="background: white; display: inline-block; border-radius: 10px; padding: 10px;">
        <canvas id="drawingCanvas" width="800" height="500" style="border:1px solid #000; cursor: crosshair;"></canvas>
    </div>
    
    <div class="mt-3">
        <button onclick="changeColor('#ff6b6b')" class="btn" style="background:#ff6b6b; width:30px; height:30px;"></button>
        <button onclick="changeColor('#feca57')" class="btn" style="background:#feca57; width:30px; height:30px;"></button>
        <button onclick="changeColor('#48dbfb')" class="btn" style="background:#48dbfb; width:30px; height:30px;"></button>
        <button onclick="changeColor('#1dd1a1')" class="btn" style="background:#1dd1a1; width:30px; height:30px;"></button>
        <button onclick="changeColor('#5f27cd')" class="btn" style="background:#5f27cd; width:30px; height:30px;"></button>
        <button onclick="clearCanvas()" class="btn btn-outline-light ml-3">Clear Board</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentColor = '#ff6b6b';

    function startPosition(e) { painting = true; draw(e); }
    function finishedPosition() { painting = false; ctx.beginPath(); }
    
    function draw(e) {
        if (!painting) return;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = currentColor;
        
        // Correct mouse position offset
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function changeColor(color) { currentColor = color; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
</script>
{% endblock %}
