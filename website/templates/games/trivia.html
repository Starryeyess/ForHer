{% extends "base.html" %} 
{% block title %}Social Trivia{% endblock %} 
{% block content %}
<div class="container mt-5 text-center text-white">
    <h2>Social Trivia</h2>
    <p>Fast-paced questions for your high-energy phase!</p>
    
    <div class="card bg-dark border-light p-4 mx-auto" style="max-width: 600px;">
        <h4 id="question-text">Loading question...</h4>
        <div id="options-container" class="mt-4 d-flex flex-column"></div>
        <p id="result-msg" class="mt-3 font-weight-bold"></p>
        <button onclick="fetchQuestion()" class="btn btn-primary mt-3">Next Question</button>
    </div>
</div>

<script>
    function decodeHtml(html) {
        var txt = document.createElement("textarea");
        txt.innerHTML = html;
        return txt.value;
    }

    function fetchQuestion() {
        document.getElementById('result-msg').textContent = '';
        document.getElementById('options-container').innerHTML = 'Loading...';
        
        fetch('https://opentdb.com/api.php?amount=1&type=multiple')
            .then(response => response.json())
            .then(data => {
                const q = data.results[0];
                document.getElementById('question-text').textContent = decodeHtml(q.question);
                
                let answers = [...q.incorrect_answers, q.correct_answer];
                // Shuffle answers
                answers.sort(() => Math.random() - 0.5);
                
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                
                answers.forEach(ans => {
                    let btn = document.createElement('button');
                    btn.className = 'btn btn-outline-light mb-2';
                    btn.textContent = decodeHtml(ans);
                    btn.onclick = () => checkAnswer(ans, q.correct_answer);
                    container.appendChild(btn);
                });
            });
    }

    function checkAnswer(selected, correct) {
        const msg = document.getElementById('result-msg');
        if (selected === correct) {
            msg.textContent = "✅ Correct! Great job!";
            msg.style.color = "#4cd137";
        } else {
            msg.textContent = "❌ Wrong! The correct answer was: " + decodeHtml(correct);
            msg.style.color = "#e84118";
        }
    }

    // Load first question on start
    fetchQuestion();
</script>
{% endblock %}
